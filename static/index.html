<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRS Pipeline</title>
<link rel="stylesheet" href="/static/styles.css?v=6">
</head>
<body>
<div class="container">
  <header>
    <h1>BRS Extractor</h1>
  </header>

  <div id="input-section" class="card">
    <h2>Input Configuration</h2>

    <div class="tabs">
      <button class="tab-btn active" data-tab="upload">Upload Video</button>
    </div>

    <div class="tab-content" id="tab-upload">
      <div class="form-group">
        <label for="video-file">Video File</label>
        <input type="file" id="video-file" accept=".mp4,.avi,.mov,.mkv">
        <span class="hint">Upload a product demo video (MP4, AVI, MOV, MKV). Indexed by Azure Video Indexer; OCR + transcript are used to extract requirements.</span>
      </div>
    </div>

    <button id="run-btn" class="btn btn-primary" onclick="startPipeline()">
      <span class="btn-icon">&#9654;</span> Generate Requirements
    </button>
  </div>

  <div id="progress-section" class="card hidden">
    <h2>Pipeline Progress</h2>
    <div id="stage-indicators" class="stage-row"></div>
    <div class="progress-bar-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
    <button id="cancel-btn" class="btn btn-danger hidden" onclick="cancelPipeline()">Cancel</button>
  </div>

  <div id="results-section" class="card hidden">
    <h2>Requirements</h2>
    <div id="requirements-list" class="requirements-list"></div>
    <div class="downloads">
      <a id="dl-docx" class="btn btn-download" download>BRS.docx</a>
      <button class="btn btn-run-again" onclick="resetUI()">Run Again</button>
    </div>
  </div>

  <div id="error-section" class="card error-card hidden">
    <h2>Error</h2>
    <p id="error-message"></p>
    <button class="btn btn-secondary" onclick="resetUI()">Try Again</button>
  </div>
</div>

<script src="/static/app.js?v=4"></script>
</body>
</html>
