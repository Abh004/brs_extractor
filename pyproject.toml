[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "business-requirements-extractor"
version = "1.0.0"
description = "Extract functional business requirements from product demo videos via VLM + LLM judges"
requires-python = ">=3.12"
dependencies = [
    "mlx-vlm>=0.5",
    "mlx-lm>=0.19.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.8.0",
    "youtube-transcript-api>=1.0",
    "huggingface-hub>=0.23.0",
    "pyspellchecker>=0.8.3",
    "bitsandbytes>=0.46.1",
    "torchvision>=2.11",
    "accelerate>=1.14.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data_prep*", "judges*", "models*"]
