[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "business-requirements-extractor"
version = "1.0.0"
description = "Extract functional business requirements from product demo videos via Azure Video Indexer + LLM judges"
requires-python = ">=3.12"
dependencies = [
    # Platform-agnostic — used by the Azure + Foundry inference path
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "pyspellchecker>=0.8.3",
    "requests>=2.31",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=12",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data_prep*", "judges*", "models*"]
