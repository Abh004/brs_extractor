[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "business-requirements-extractor"
version = "1.0.0"
description = "Extract functional business requirements from product demo videos via Azure Video Indexer + LLM judges"
requires-python = ">=3.12"
dependencies = [
    # Platform-agnostic — used regardless of inference backend
    "numpy>=1.26.0",
    "huggingface-hub>=0.23.0",
    "python-dotenv>=1.0.0",
    "pyspellchecker>=0.8.3",
    "requests>=2.31",

    # Apple Silicon only — MLXBackend (judge LLM / unified VLM-as-LLM)
    "mlx-vlm>=0.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.19.0; sys_platform == 'darwin' and platform_machine == 'arm64'",

    # Everything else (Linux, Windows, Intel Mac, Colab/CUDA) — HFBackend
    "torch>=2.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "torchaudio>=2.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "transformers>=4.46.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "accelerate>=1.14.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "torchvision>=0.27; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "pillow>=10.0.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.optional-dependencies]
quantization = ["bitsandbytes>=0.46.1"]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=12",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data_prep*", "judges*", "models*"]
